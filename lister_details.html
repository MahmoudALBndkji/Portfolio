<!DOCTYPE html>

  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport" />
  <meta name="theme-color" content="#e8f4fb" />
  <script>
    (function () {
      try {
        var k = "portfolio-color-scheme-pref";
        var v = localStorage.getItem(k);
        if (v === "light" || v === "dark") {
          document.documentElement.setAttribute("data-color-scheme", v);
        }
        var dark =
          v === "dark" ||
          (v !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute("content", dark ? "#0f172a" : "#e8f4fb");
      } catch (e) {}
    })();
  </script>
  <title>Portfolio · Project details</title>
